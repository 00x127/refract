<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="600" height="150" role="img" aria-label="refract">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#121a2b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6edf3" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8b949e" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="150" rx="14" fill="url(#bg)"/>

  <!-- white ray entering the prism -->
  <line x1="20" y1="75" x2="62" y2="75" stroke="#f0f6fc" stroke-width="2.4" filter="url(#glow)"/>

  <!-- glass prism -->
  <polygon points="62,44 62,106 114,75" fill="url(#glass)" stroke="#aeb7c2" stroke-width="1.3"/>

  <!-- refracted spectrum -->
  <g filter="url(#glow)" stroke-width="2.2" stroke-linecap="round">
    <line x1="114" y1="75" x2="170" y2="49" stroke="#6ca8ff"/>
    <line x1="114" y1="75" x2="170" y2="66" stroke="#4fd1c5"/>
    <line x1="114" y1="75" x2="170" y2="85" stroke="#f6c177"/>
    <line x1="114" y1="75" x2="170" y2="101" stroke="#f2778d"/>
  </g>

  <!-- wordmark -->
  <text x="190" y="86" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="50" font-weight="700" fill="#f0f6fc" letter-spacing="0.5">refract</text>

  <!-- tagline -->
  <text x="192" y="113" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="14" fill="#7d8590">recover a hidden API schema from its own errors</text>
</svg>
